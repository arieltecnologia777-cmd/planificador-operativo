<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login – Portal de Técnicos</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #EEF2FA; display: grid; place-items: center; height: 100vh; margin: 0; }
  .login-card { background: #fff; padding: 32px; border-radius: 20px; box-shadow: 0 14px 30px rgba(15,27,61,.1); width: 100%; max-width: 380px; box-sizing: border-box; }
  h2 { margin-top: 0; color: #0F1B3D; font-size: 22px; font-weight: 800; }
  .input-group { margin-bottom: 16px; }
  label { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 6px; }
  input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box; font-weight: 600; }
  input:focus { border-color: #1D5FE0; }
  button { width: 100%; background: #1D5FE0; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
  button:hover { background: #174dc4; }
  .error-msg { color: #E0334C; font-size: 12px; font-weight: 700; margin-top: 10px; text-align: center; display: none; }
</style>
</head>
<body>

<div class="login-card">
  <h2>Portal Técnicos</h2>
  <p style="color: #64748b; font-size: 13px; margin-bottom: 24px;">Ingresa tus credenciales para acceder.</p>
  
  <form id="loginForm">
    <div class="input-group">
      <label for="cedula">Cédula (Usuario)</label>
      <input type="text" id="cedula" required placeholder="Ej. 12345678">
    </div>
    <div class="input-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>
    <button type="submit">Iniciar Sesión</button>
    <div id="errorMsg" class="error-msg">Cédula o contraseña incorrecta</div>
  </form>
</div>

<script>
// Ajusta esta URL si tu worker tiene otra ruta base
const API_URL = "https://facturacion.modulo-de-exclusiones.workers.dev/api/login";

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const cedula = document.getElementById('cedula').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorDiv = document.getElementById('errorMsg');
    errorDiv.style.display = 'none';

    try {
        const resp = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cedula, password })
        });
        const data = await resp.json();

        if (data.ok) {
            // Guardamos el nombre del técnico logueado en la sesión del navegador
            localStorage.setItem('tecnicoLogueado', data.nombre_tecnico);
            // Redirigimos al portal de técnicos principal
            window.location.href = 'portal-tecnicos.html';
        } else {
            errorDiv.textContent = data.error || "Credenciales inválidas";
            errorDiv.style.display = 'block';
        }
    } catch (err) {
        console.error(err);
        errorDiv.textContent = "Error de conexión con el servidor";
        errorDiv.style.display = 'block';
    }
});
</script>
</body>
</html>
