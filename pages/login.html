<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login – Portal de Técnicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="login-card">
  <!-- Avatar superior -->
  <div class="avatar-container">
    <img src="../assets/assistant_casco.png" alt="Avatar Dominic">
  </div>

  <h2>Bienvenido al Generador MCI</h2>
  
  <form id="loginForm">
    <div class="input-group">
      <label for="cedula">Cédula (Usuario)</label>
      <input type="text" id="cedula" required placeholder="Ej. 1234567">
    </div>
    <div class="input-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>
    <button type="submit">Ingresar</button>
    <div id="errorMsg" class="error-msg">Cédula o contraseña incorrecta</div>
  </form>

  <!-- Logotipo inferior -->
  <div class="footer-brand">
    <img src="../assets/dominion_logo.png" alt="Dominion Logo">
    <span>DOMINION</span>
  </div>
</div>

<script src="../js/login.js"></script>
</body>
</html>
