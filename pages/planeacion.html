<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeación Operativa</title>
    <!-- Tus enlaces a CSS aquí -->
    <style>
        /* Estilos recomendados para evitar el efecto fantasma y alinear las flechas */
        .planeacion-table-wrapper, .planeacion-scroll-top {
            transform: translateZ(0);
            will-change: scroll-position;
            backface-visibility: hidden;
        }

        .scroll-control-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .scroll-control-container .planeacion-scroll-top {
            flex-grow: 1;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .btn-scroll-step {
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 4px;
            width: 32px;
            height: 28px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: background-color 0.2s;
        }

        .btn-scroll-step:hover {
            background-color: #e2e6ea;
        }

        .btn-scroll-step:active {
            background-color: #dae0e5;
        }
    </style>
</head>
<body>

    <div class="panel">
        <!-- Controles de la tabla y filtros -->
        <div class="planeacion-header">
            <!-- Tus elementos de cabecera -->
        </div>

        <div class="planeacion-filtros-sticky">
            <!-- Tus filtros -->
        </div>

        <!-- ========================================== -->
        <!-- BARRA SUPERIOR CON FLECHAS DE SCROLL       -->
        <!-- ========================================== -->
        <div class="scroll-control-container">
            <button type="button" class="btn-scroll-step" id="scrollLeftBtn" title="Desplazar a la izquierda">◀</button>
            
            <div class="planeacion-scroll-top">
                <div class="planeacion-scroll-top-inner" style="width: 2500px; height: 1px;"></div>
            </div>
            
            <button type="button" class="btn-scroll-step" id="scrollRightBtn" title="Desplazar a la derecha">▶</button>
        </div>

        <!-- ========================================== -->
        <!-- CONTENEDOR DE LA TABLA                     -->
        <!-- ========================================== -->
        <div class="planeacion-table-wrapper">
            <table class="planeacion-table">
                <thead>
                    <!-- Tus encabezados -->
                </thead>
                <tbody id="planeacionBody">
                    <!-- Los datos se inyectan mediante JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal de Observaciones -->
    <div id="modalObservacion" class="modal-observaciones" style="display: none;">
        <div class="modal-content">
            <h3>Editar Observación</h3>
            <div class="modal-info-ot">
                <span>OT: <strong id="modalValOt">--</strong></span>
                <span>ID: <strong id="modalValId">--</strong></span>
                <span>Depto: <strong id="modalValDepto">--</strong></span>
                <span>Municipio: <strong id="modalValMuni">--</strong></span>
                <span>Afectación: <strong id="modalValAfec">--</strong></span>
            </div>
            <textarea id="textareaModalObs" placeholder="Escribe tus observaciones aquí (puedes usar Enter para saltos de línea)..." rows="6"></textarea>
            <div class="modal-botones">
                <button type="button" id="btnCancelarObs" class="btn-secundario">Cancelar</button>
                <button type="button" id="btnGuardarObs" class="btn-primario">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Tu archivo JavaScript -->
    <script src="planeacion.js"></script>
</body>
</html>
