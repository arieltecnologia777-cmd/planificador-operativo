<!doctype html>
<html lang="es">

<div class="app">

<aside class="side" id="appSidebar">
  <div class="brand">
    <img src="../assets/dominion_logo.png" alt="Dominion" style="width: 120px; height: auto; object-fit: contain;">
  </div>
  <nav class="nav" aria-label="Principal">
    <a href="facturacion.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>Facturación</a>
    <a class="on" href="portal-tecnicos.html" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1z"/></svg>Mi Rendimiento</a>
    <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Órdenes de Trabajo</a>
    <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V10M12 21V4M19 21v-7"/></svg>Reportes</a>
    <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l-.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Configuración</a>
    
    <a href="#" onclick="toggleSidebar(); return false;" class="nav-close-mobile" style="color: #E0334C;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>Cerrar menú</a>
  </nav>
  
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 2;">
    <div class="tag">Tu trabajo<br>hace que todo<br>funcione</div>
    <a href="facturacion.html" style="text-decoration: none;">
      <button type="button" style="width: 100%; background: #0f172a; color: white; border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 0.82rem; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px;">

</aside>

<main class="main">
  <header class="top">
    <label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6584" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="q" type="search" placeholder="Buscar órdenes, técnicos o códigos…" aria-label="Buscar órdenes, técnicos o códigos"></label>
    <div class="spacer"></div>
    <button class="bell" aria-label="Notificaciones, 1 nueva"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F1B3D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9a6 6 0 0112 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 004 0"/></svg><i></i></button>
    <button class="user"><span class="av">AR</span><span class="n">Ariel Marquez Rada</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  </header>

  <section class="hero" aria-label="Bienvenida">
    <div class="txt">
      <div class="eyebrow">PORTAL DE TÉCNICOS</div>
      <h1>Mi Rendimiento<br>Financiero</h1>
      <p>Consulta tu meta personal, montos aprobados, rechazos y estados en tiempo real.</p>
    </div>
    <img src="../assets/assistant_casco.png" alt="Dominic, la mascota del portal" class="mascot-img">
  </section>

  <!-- Resto de secciones de la app... -->
  <section class="card profile" aria-label="Perfil y periodo">
    <div class="sel">
      <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>
      <div style="flex:1"><label for="tec">Tu perfil técnico</label>
        <select id="tec"><option>CAMILO ANDRES SALAZAR BARBOSA</option><option>Ariel Marquez Rada</option></select></div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F1B3D" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="period">
      <span class="cal"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D5FE0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
      <div><small>Periodo actual</small><b>Abr 2025 – Jun 2025</b></div>
    </div>
  </section>
</main>
</div>

<script>
function toggleSidebar() {
  const sidebar = document.getElementById('appSidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.toggle('activo');
  overlay.classList.toggle('activo');
}
</script>
<script src="../js/facturaciontecnicos.js"></script>
