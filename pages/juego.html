<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡A Contar y Jugar! 🍎🔢</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fbc531 0%, #e84118 100%);
            font-family: 'Comic Sans MS', 'Bubblegum Sans', cursive, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }
        header {
            margin-top: 15px;
            text-align: center;
            z-index: 10;
        }
        h1 {
            color: #fff;
            font-size: 1.8rem;
            margin: 0;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }
        #marcador {
            font-size: 1.3rem;
            color: #2f3640;
            background: rgba(255, 255, 255, 0.9);
            padding: 5px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            font-weight: bold;
        }
        .tarjeta-juego {
            background: rgba(255, 255, 255, 0.95);
            width: 90%;
            max-width: 400px;
            border-radius: 25px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin: auto;
        }
        .pregunta {
            font-size: 1.4rem;
            color: #2f3640;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }
        #contenedor-objetos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            min-height: 120px;
            align-items: center;
            margin-bottom: 20px;
            background: #f5f6fa;
            width: 100%;
            border-radius: 15px;
            padding: 15px;
            border: 3px dashed #dcdde1;
        }
        .objeto {
            font-size: 2.8rem;
            animation: aparecer 0.3s ease-in-out;
        }
        @keyframes aparecer {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
        .opciones {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }
        .btn-opcion {
            background-color: #0097e6;
            color: white;
            border: none;
            font-size: 2rem;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 6px 0px #0068a3;
            font-family: inherit;
            font-weight: bold;
            transition: transform 0.1s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-opcion:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #0068a3;
        }
        #mensaje-feedback {
            font-size: 1.6rem;
            margin-top: 15px;
            font-weight: bold;
            min-height: 40px;
            text-align: center;
        }
        .correcto { color: #44bd32; }
        .incorrecto { color: #e84118; }
        footer {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🔢 ¿Cuántos hay? 🍎</h1>
        <div id="marcador">Puntuación: 0 ⭐</div>
    </header>

    <div class="tarjeta-juego">
        <div class="pregunta">¡Cuenta los objetos y toca el número correcto!</div>
        
        <div id="contenedor-objetos">
            <!-- Aquí se cargan los dibujitos -->
        </div>

        <div class="opciones" id="contenedor-opciones">
            <!-- Botones de respuesta -->
        </div>

        <div id="mensaje-feedback"></div>
    </div>

    <footer>
        <button style="background:#fff; border:none; padding:8px 20px; border-radius:15px; font-family:inherit; font-weight:bold; color:#e84118; cursor:pointer;" onclick="iniciarJuego()">🔄 Reiniciar</button>
    </footer>

    <script>
        const contenedorObjetos = document.getElementById('contenedor-objetos');
        const contenedorOpciones = document.getElementById('contenedor-opciones');
        const marcador = document.getElementById('marcador');
        const mensajeFeedback = document.getElementById('mensaje-feedback');

        let puntuacion = 0;
        let respuestaCorrecta = 0;

        const emojis = [
            {icono: '🍎', nombre: 'manzanas'},
            {icono: '⭐️', nombre: 'estrellas'},
            {icono: '🐱', nombre: 'gatitos'},
            {icono: '🎈', nombre: 'globos'},
            {icono: '🚗', nombre: 'carritos'}
        ];

        function hablar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Parar audio previo
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'es-ES';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function iniciarJuego() {
            mensajeFeedback.textContent = "";
            contenedorObjetos.innerHTML = "";
            contenedorOpciones.innerHTML = "";

            // Elegir cantidad aleatoria entre 1 y 5 (ideal para niños pequeños)
            respuestaCorrecta = Math.floor(Math.random() * 5) + 1;
            
            // Elegir un emoji aleatorio
            const itemAleatorio = emojis[Math.floor(Math.random() * emojis.length)];

            // Pintar los objetos en pantalla
            for (let i = 0; i < respuestaCorrecta; i++) {
                const span = document.createElement('span');
                span.classList.add('objeto');
                span.textContent = itemAleatorio.icono;
                contenedorObjetos.appendChild(span);
            }

            hablar(`¿Cuántos ${itemAleatorio.nombre} ves?`);

            // Generar opciones de respuesta (3 botones: la correcta y 2 distractores)
            let opciones = [respuestaCorrecta];
            while (opciones.length < 3) {
                let numAleatorio = Math.floor(Math.random() * 5) + 1;
                if (!opciones.includes(numAleatorio)) {
                    opciones.push(numAleatorio);
                }
            }

            // Mezclar opciones para que no siempre esté en el mismo orden
            opciones.sort(() => Math.random() - 0.5);

            // Crear botones en pantalla
            opciones.forEach(num => {
                const btn = document.createElement('button');
                btn.classList.add('btn-opcion');
                btn.textContent = num;
                btn.addEventListener('click', () => verificarRespuesta(num));
                contenedorOpciones.appendChild(btn);
            });
        }

        function verificarRespuesta(seleccionado) {
            // Desactivar botones momentáneamente para evitar doble clic
            const botones = document.querySelectorAll('.btn-opcion');
            botones.forEach(b => b.style.pointerEvents = 'none');

            if (seleccionado === respuestaCorrecta) {
                puntuacion++;
                marcador.textContent = `Puntuación: ${puntuacion} ⭐`;
                mensajeFeedback.textContent = "¡Muy bien! 🎉 ¡Correcto!";
                mensajeFeedback.className = "correcto";
                hablar("¡Muy bien, excelente!");

                setTimeout(() => {
                    iniciarJuego();
                }, 1500);
            } else {
                mensajeFeedback.textContent = "¡Inténtalo otra vez! ❌";
                mensajeFeedback.className = "incorrecto";
                hablar("Inténtalo de nuevo");

                setTimeout(() => {
                    botones.forEach(b => b.style.pointerEvents = 'auto');
                    mensajeFeedback.textContent = "";
                }, 1200);
            }
        }

        // Iniciar al cargar la página
        window.onload = () => {
            setTimeout(iniciarJuego, 500);
        };
    </script>
</body>
</html>
