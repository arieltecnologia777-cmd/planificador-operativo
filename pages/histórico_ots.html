<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de OTs Completadas</title>
    <!-- Vinculación correcta de tu archivo CSS -->
    <link rel="stylesheet" href="histórico.css">
</head>
<body>

    <div class="container">
        <!-- Cabecera de la sección con estilo hero de tu proyecto -->
        <div class="hero-header">
            <div>
                <h1>📋 Histórico de OTs Completadas</h1>
                <p class="subtitle">Consulta todas las órdenes que han finalizado su gestión operativa y revierte las que necesites.</p>
            </div>
            <div>
                <a href="index.html" class="btn-volver">⬅ Volver a Planeación</a>
            </div>
        </div>

        <!-- Barra de herramientas con buscador -->
        <div class="toolbar">
            <input type="text" id="filtroBusquedaHistorico" class="search-input" placeholder="🔍 Buscar en todo el histórico...">
            <span id="contadorRegistros" style="font-size: 0.85rem; color: #4a5568; font-weight: 650;"></span>
        </div>

        <!-- Contenedor y tabla que te gusta -->
        <div class="table-wrapper">
            <table class="historico-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Departamento</th>
                        <th>Municipio</th>
                        <th>IM</th>
                        <th>OT</th>
                        <th>Afectación</th>
                        <th>Estado Gestión</th>
                        <th>Técnico Asignado</th>
                        <th>Observación</th>
                        <th>Fecha Completada</th>
                        <th style="text-align: center;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="historicoBody">
                    <!-- Los registros se inyectarán dinámicamente mediante historico.js -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Vinculación del script del histórico -->
    <script src="historico.js"></script>
</body>
</html>
